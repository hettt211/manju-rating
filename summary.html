    arr.sort(function(a, b){
      if(SORT === "up") return b.up - a.up;
      if(SORT === "down") return b.down - a.down;
      return b.net - a.net;
    });
    tbody.innerHTML = arr.map(function(x, i){
      var cls = "badge badge-" + x.r.replace("+", "\+");
      var netCls = x.net > 0 ? "net-pos" : (x.net < 0 ? "net-neg" : "");
      return '<tr><td class="rank">' + (i+1) + '</td>' +
        '<td>' + x.n + '</td>' +
        '<td><span class="' + cls + '">' + x.r + '</span></td>' +
        '<td class="num">' + x.up + '</td>' +
        '<td class="num">' + x.down + '</td>' +
        '<td class="num ' + netCls + '">' + (x.net > 0 ? "+" : "") + x.net + '</td></tr>';
    }).join("");
  }

  function refresh(){
    fetch(VOTE_API + "/api/vote/all").then(function(r){ return r.json(); })
      .then(function(d){ DATA = d; render(); }).catch(function(){});
  }

  document.querySelectorAll(".toolbar button").forEach(function(b){
    b.addEventListener("click", function(){
      SORT = b.getAttribute("data-sort");
      document.querySelectorAll(".toolbar button").forEach(function(x){ x.classList.remove("active"); });
      b.classList.add("active");
      render();
    });
  });

  refresh();
  setInterval(refresh, 15000);
})();
</script>
</body>
</html>
